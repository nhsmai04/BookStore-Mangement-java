<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
<head layout:fragment="head">
    <title>All Authors</title>
</head>
<body>
<div layout:fragment="content">
    <div class="content">
        <div class="container-fluid p-0">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h3 mb-0">
                    <strong th:text="#{authorlist.title}"></strong>
                </h1>
                <a th:href="@{/admin/authors/add}" class="btn btn-primary" th:text="'+ ' + #{table.button-add}"></a>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="card flex-fill">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                <tr>
                                    <th th:text="#{table.authorname}">Author Name</th>
                                    <th th:text="#{table.count-book}">Books</th>
                                </tr>
                                </thead>

                                <tbody>
                                <tr th:each="author : ${authorPage.content}">
                                    <td  th:text="${author.name}"></td>

                                    <!-- Danh sách sách -->
                                    <td  th:text="${author.countBook}"></td>
                                    <td class="d-none d-xl-table-cell text-center" style="padding: 8px;">
                                        <a th:href="@{'/admin/authors/' + ${author.id}}"
                                           class="btn btn-primary"
                                           th:text="#{table.button-view}">
                                        </a>

                                        <a th:href="@{'/admin/authors/edit/' + ${author.id}}"
                                           class="btn btn-warning"
                                           th:text="#{table.button-edit}">
                                        </a>

                                        <button type="button" class="btn btn-danger"
                                                data-bs-toggle="modal"
                                                data-bs-target="#confirmDeleteModal"
                                                th:text="#{table.button-delete}">
                                        </button>
                                    </td>
                                </tr>


                                </tbody>
                            </table>
                        </div>
                    </div>
                        <!-- Pagination -->
                    <nav aria-label="Page navigation">
                        <ul class="pagination justify-content-center mt-3">

                            <!-- Previous -->
                            <li class="page-item"
                                th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link"
                                   aria-label="Previous"
                                   th:href="@{/admin/authors(
                    page=${currentPage - 1},
                    size=${size}
               )}">
                                    <span aria-hidden="true">&laquo;</span>
                                </a>
                            </li>

                            <!-- Page numbers -->
                            <li class="page-item"
                                th:if="${totalPages > 0}"
                                th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                th:classappend="${i == currentPage} ? ' active'">
                                <a class="page-link"
                                   th:text="${i + 1}"
                                   th:href="@{/admin/authors(
                    page=${i},
                    size=${size}
               )}">
                                </a>
                            </li>

                            <!-- Trường hợp chỉ có 1 trang -->
                            <li class="page-item active"
                                th:if="${totalPages == 0}">
                                <a class="page-link"
                                   th:text="1"
                                   th:href="@{/admin/authors(
                                                    page=0,
                                                    size=${size}
                                                    )}">
                                </a>
                            </li>

                            <!-- Next -->
                            <li class="page-item"
                                th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                <a class="page-link"
                                   aria-label="Next"
                                   th:href="@{/admin/authors(
                                                    page=${currentPage + 1},
                                                    size=${size}
                                                    )}">
                                    <span aria-hidden="true">&raquo;</span>
                                </a>
                            </li>

                        </ul>
                    </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
