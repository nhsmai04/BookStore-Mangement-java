<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">

<head layout:fragment="head">
    <title>Chi tiết Sách</title>
</head>
<body>
<div layout:fragment="content">
    <div class="content">
        <div class="container-fluid p-0">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h3 mb-0">
                    <strong th:text="#{bookdetail.title}"></strong>
                </h1>
            </div>

            <div class="row">
                <div class="col-12 col-lg-12 col-xxl-12 d-flex">
                    <div class="card flex-fill p-4">
                        <div class="row">
                            <!-- Cột ảnh bìa -->
                            <div class="col-md-4 text-center">
                                <img src="/public/images/default-avatar.png" alt="Book Cover" class="img-detail rounded shadow">
                            </div>

                            <!-- Cột thông tin sách -->
                            <div class="col-md-8">
                                <h2 th:text="${book.title}"></h2>
                                <p class="mb-1">
                                    <strong th:text="#{book.detail.author} + ':'"></strong>
                                    <span th:each="author : ${book.authorName}">
                                        <span th:text="${author}"></span>
                                    </span>
                                </p>
                                <p class="mb-1">
                                    <strong th:text="#{book.detail.publisher} + ':'"></strong>
                                    <span th:text="${book.publisherName}"></span>
                                </p>
                                <p class="mb-3">
                                    <strong th:text="#{book.detail.publishedDate} + ':'"></strong>
                                    <span th:text="${book.publishedDay}"></span>
                                </p>

                                <h5 th:text="#{book.detail.description}"></h5>
                                <p>
                                    <span th:text="${book.description}"></span>
                                </p>
                            </div>
                        </div>

                        <!-- Bảng danh sách phiên bản sách -->
                        <div class="row mt-4">
                            <div class="col-12">
                                <h4 th:text="#{book.detail.versionList}"></h4>
                                <table class="table table-bordered table-striped align-middle">
                                    <thead class="table-dark">
                                    <tr>
                                        <th class="d-none d-xl-table-cell text-center" th:text="#{book.version.index}"></th>
                                        <th class="d-none d-xl-table-cell text-center" th:text="#{book.version.code}"></th>
                                        <th class="d-none d-xl-table-cell text-center" th:text="#{book.version.language}"></th>
                                        <th class="d-none d-xl-table-cell text-center" th:text="#{book.version.format}"></th>
                                        <th class="d-none d-xl-table-cell text-center" th:text="#{book.version.status}"></th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="bookversion, stat : ${bookVersions}">
                                        <td class="d-none d-xl-table-cell text-center" th:text="${stat.index + 1}"></td>
                                        <td class="d-none d-xl-table-cell text-center" th:text="${bookversion.id}"></td>
                                        <td class="d-none d-xl-table-cell text-center">Tiếng Việt</td>
                                        <td class="d-none d-xl-table-cell text-center">Bìa cứng</td>
                                        <td class="d-none d-xl-table-cell text-center">
                                        <span th:switch="${bookversion.status}">
                                            <span th:case="1" class="badge bg-success">Có sẵn</span>
                                            <span th:case="0" class="badge bg-danger">Hỏng / Mất</span>
                                            <span th:case="2" class="badge bg-warning text-dark">Đang mượn</span>
                                            <span th:case="3" class="badge bg-primary">Đang đặt trước</span>
                                            <span th:case="4" class="badge bg-secondary">Đang sửa</span>
                                            <span th:case="*">Không xác định</span>
                                        </span>
                                        </td>
                                    </tr>

                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <nav th:if="${bookVersions.totalPages > 1}">
                <ul class="pagination">
                    <li th:classappend="${bookVersions.first} ? 'disabled'">
                        <a th:href="@{|?page=${bookVersions.number - 1}|}">&laquo;</a>
                    </li>
                    <li th:each="pageNum : ${#numbers.sequence(0, bookVersions.totalPages - 1)}"
                        th:classappend="${pageNum == bookVersions.number} ? 'active'">
                        <a th:href="@{|?page=${pageNum}|}" th:text="${pageNum + 1}"></a>
                    </li>
                    <li th:classappend="${bookVersions.last} ? 'disabled'">
                        <a th:href="@{|?page=${bookVersions.number + 1}|}">&raquo;</a>
                    </li>
                </ul>
            </nav>

        </div>
    </div>
</div>
</body>
</html>
