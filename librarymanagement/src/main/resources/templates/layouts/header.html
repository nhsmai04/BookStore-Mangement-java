<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
</head>
<body>
<div th:fragment="header">
    <div class="dashboard-header">
        <nav class="navbar navbar-expand fixed-top">
            <div class="container-fluid">

                <!-- Mobile Sidebar Toggle -->
                <button sec:authorize="isAuthenticated()"
                        class="navbar-toggler sidebar-toggler me-3 d-lg-none"
                        type="button" aria-label="Toggle sidebar">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Brand -->
                <a class="navbar-brand" th:href="@{/admin/dashboard}">Library</a>

                <!-- Search Bar - Hidden on Mobile -->
                <div class="mx-auto d-none d-md-block">
                    <div class="top-search-bar">
                        <i class="fas fa-search search-icon"></i>
                        <input class="form-control" type="search" placeholder="Search anything..." aria-label="Search">
                    </div>
                </div>

                <!-- Right Side Items -->
                <ul class="navbar-nav ms-auto navbar-right-top">

                    <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-icon dropdown-toggle" href="#" id="alertsDropdown"
                           role="button" data-bs-toggle="dropdown" aria-expanded="false"
                           onclick="loadNotifications()">
                            <div class="position-relative">
                                <i class="fa-solid fa-bell nav-icons"></i>
                                <span class="indicator" id="notificationCount">0</span>
                            </div>
                        </a>

                        <ul class="dropdown-menu dropdown-menu-lg dropdown-menu-start py-0"
                            aria-labelledby="alertsDropdown">

                            <li class="dropdown-menu-header">
                                <span id="notificationHeader">Notifications</span>
                            </li>

                            <li class="list-group" id="notificationList">
                                <!-- notifications render bằng JS -->
                            </li>

                            <li class="dropdown-menu-footer">
                                <a href="#" class="text-muted">Show all notifications</a>
                            </li>
                        </ul>
                    </li>

                    <!-- User Profile -->
                    <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle d-none d-sm-inline-block" href="#" id="avatarDropdown" role="button" aria-expanded="false">
                            <img th:src="${currentUser != null && currentUser.avatar != null ? currentUser.avatar : '/public/images/default-avatar.png'}"
                                 class="avatar img-fluid rounded me-1" alt="${currentUser.username}" />
                        </a>
                        <div class="dropdown-menu dropdown-menu-end" aria-labelledby="avatarDropdown">
                            <a class="dropdown-item" href="pages-profile.html"><i class="fa-solid fa-user"></i> Trang cá nhân</a>
                            <a class="dropdown-item" href="#"><i class="fa-solid fa-gear"></i> Cài đặt</a>
                            <div class="dropdown-divider"></div>
                            <a class="dropdown-item" href="#"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</a>
                        </div>
                    </li>

                    <!-- Login Link for Guests -->
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link-header" th:href="@{/admin/auth/login}">Login</a>
                    </li>

                </ul>
            </div>
        </nav>
    </div>

    <!-- Mobile Search Modal -->
    <div class="modal fade" id="searchModal" tabindex="-1" aria-labelledby="searchModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="searchModalLabel">Search</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input class="form-control form-control-lg" type="search" placeholder="Search anything..." aria-label="Search" autofocus>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/public/js/layouts/header.js}"></script>
</div>
</body>
</html>
